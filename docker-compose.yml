version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=medical_vault_jwt_super_secret_key_2026_xyz
      - MASTER_VAULT_KEY=a4f9b231c58e72d1490218f76d4e1bc2a4f9b231c58e72d1490218f76d4e1bc2
      - AI_SERVICE_URL=http://ai_service:8000
    depends_on:
      - ai_service

  ai_service:
    build:
      context: ./ai_service
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
